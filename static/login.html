<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>login</title>
    <style>
      body {
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 1rem;
        display: grid;
        place-items: center;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 16rem;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/api/login">
      <input
        name="username"
        aria-label="username"
        placeholder="username"
        autocomplete="username"
        required
      />
      <input
        name="password"
        type="password"
        aria-label="password"
        placeholder="password"
        autocomplete="current-password"
        required
      />
      <button type="submit">login</button>
    </form>
  </body>
</html>
