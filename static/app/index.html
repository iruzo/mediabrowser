<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mediabrowser</title>
    <link rel="stylesheet" href="/ui/app/base.css" />
    <link rel="stylesheet" href="/ui/files/layout.css" />
    <link rel="stylesheet" href="/ui/files/menu.css" />
    <link rel="stylesheet" href="/ui/notifications/notifications.css" />
    <link rel="stylesheet" href="/ui/viewer/viewer.css" />
    <link rel="stylesheet" href="/ui/app/responsive.css" />
  </head>
  <body>
    <div class="search-container" id="searchContainer">
      <input
        type="text"
        class="search-bar"
        placeholder="Search files..."
        id="searchInput"
        oninput="filterBySearch(this.value)"
      />
    </div>

    <div class="gallery-container">
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div class="item-context-menu" id="itemContextMenu" hidden>
      <button
        class="item-context-menu-btn"
        type="button"
        onclick="closeItemContextMenu(); triggerUpload()"
      >
        upload
      </button>
      <button
        class="item-context-menu-btn"
        type="button"
        onclick="closeItemContextMenu(); createFolder()"
      >
        create folder
      </button>
      <button
        class="item-context-menu-btn"
        type="button"
        onclick="deleteContextItem()"
      >
        delete
      </button>
      <button
        class="item-context-menu-btn"
        type="button"
        onclick="renameContextItem()"
      >
        rename
      </button>
      <button
        class="item-context-menu-btn"
        id="contextSelectModeBtn"
        type="button"
        onclick="toggleSelectionMode()"
      >
        select mode
      </button>
      <div class="hidden" id="contextSelectionActions">
        <button
          class="item-context-menu-btn"
          id="contextSelectAllBtn"
          type="button"
          onclick="toggleSelectAll()"
        >
          &nbsp;&nbsp;select all
        </button>
        <button
          class="item-context-menu-btn"
          type="button"
          onclick="closeItemContextMenu(); renameSelected()"
        >
          &nbsp;&nbsp;rename selected
        </button>
        <button
          class="item-context-menu-btn"
          type="button"
          onclick="closeItemContextMenu(); downloadSelected()"
        >
          &nbsp;&nbsp;download selected
        </button>
        <button
          class="item-context-menu-btn"
          type="button"
          onclick="closeItemContextMenu(); deleteSelected()"
        >
          &nbsp;&nbsp;delete selected
        </button>
      </div>
      <div class="item-context-menu-section">
        <span>grid size</span>
        <button
          class="item-context-menu-btn item-context-menu-inline-btn"
          type="button"
          onclick="decreaseGridSize()"
        >
          -
        </button>
        <button
          class="item-context-menu-btn item-context-menu-inline-btn"
          type="button"
          onclick="increaseGridSize()"
        >
          +
        </button>
      </div>
      <div class="item-context-menu-section">
        <span>sort</span>
        <select
          class="item-context-menu-select"
          data-context-sort
          onchange="changeSort(this.value)"
        >
          <option value="name">name</option>
          <option value="date">date</option>
          <option value="size">size</option>
          <option value="type">type</option>
        </select>
      </div>
      <div class="item-context-menu-section">
        <span>filter</span>
        <select
          class="item-context-menu-select"
          data-context-filter
          onchange="changeFilter(this.value)"
        >
          <option value="all">all</option>
          <option value="image">images</option>
          <option value="video">videos</option>
          <option value="audio">audio</option>
          <option value="text">text</option>
        </select>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="viewer-dropdown" id="viewerDropdown">
        <div class="viewer-dropdown-menu">
          <button class="viewer-btn" onclick="closeViewer()">close</button>
          <button class="viewer-btn" onclick="downloadCurrent()">
            download
          </button>
          <button
            class="viewer-btn"
            id="saveTextBtn"
            onclick="saveTextFile()"
            style="display: none"
          >
            save
          </button>
          <button class="viewer-btn" onclick="previousMedia()">prev</button>
          <button class="viewer-btn" onclick="nextMedia()">next</button>
          <div
            class="viewer-dropdown-section"
            id="zoomControls"
            style="display: none"
          >
            <button class="viewer-btn" onclick="zoomIn()">+</button>
            <button class="viewer-btn" onclick="zoomOut()">-</button>
            <button class="viewer-btn" onclick="moveUp()">up</button>
            <button class="viewer-btn" onclick="moveDown()">down</button>
            <button class="viewer-btn" onclick="moveLeft()">left</button>
            <button class="viewer-btn" onclick="moveRight()">right</button>
            <button
              class="viewer-btn"
              onclick="rotateLeft()"
              title="Rotate left 45 degrees"
            >
              rleft
            </button>
            <button
              class="viewer-btn"
              onclick="rotateRight()"
              title="Rotate right 45 degrees"
            >
              rright
            </button>
            <button class="viewer-btn" onclick="resetZoom()">reset</button>
          </div>
          <div
            class="viewer-dropdown-section"
            id="loopControls"
            style="display: none"
          >
            <button
              class="viewer-btn"
              onclick="seekBackward()"
              title="Seek backward 1 second"
            >
              -1s
            </button>
            <input
              type="text"
              id="loopStartInput"
              class="time-input"
              placeholder="0:00"
              title="Loop start time (MM:SS)"
              onchange="onLoopTimeChange(true)"
            />
            <span>-</span>
            <input
              type="text"
              id="loopEndInput"
              class="time-input"
              placeholder="0:00"
              title="Loop end time (MM:SS)"
              onchange="onLoopTimeChange(false)"
            />
            <button
              class="viewer-btn"
              onclick="seekForward()"
              title="Seek forward 1 second"
            >
              +1s
            </button>
            <button class="viewer-btn" onclick="clearLoop()" title="Clear loop">
              clear
            </button>
          </div>
        </div>
        <button
          class="viewer-dropdown-toggle"
          onclick="
            document.getElementById('viewerDropdown').classList.toggle('open')
          "
        >
          menu
        </button>
      </div>
      <div id="viewerContent"></div>
    </div>

    <div class="upload-progress" id="uploadProgress" style="display: none">
      <div class="upload-progress-header">
        <span id="uploadProgressText">Uploading: 0/0</span>
      </div>
      <div class="upload-progress-files" id="uploadProgressFiles"></div>
    </div>

    <input
      type="file"
      id="fileInput"
      multiple
      onchange="handleFileSelect(this.files)"
    />

    <script src="/ui/app/state.js"></script>
    <script src="/ui/app/utils.js"></script>
    <script src="/ui/notifications/notifications.js"></script>
    <script src="/ui/files/navigation.js"></script>
    <script src="/ui/files/gallery.js"></script>
    <script src="/ui/files/selection.js"></script>
    <script src="/ui/viewer/viewer.js"></script>
    <script src="/ui/viewer/image-viewer.js"></script>
    <script src="/ui/viewer/video-viewer.js"></script>
    <script src="/ui/viewer/audio-viewer.js"></script>
    <script src="/ui/viewer/text-viewer.js"></script>
    <script src="/ui/viewer/media-controls.js"></script>
    <script src="/ui/files/file-ops.js"></script>
    <script src="/ui/app/main.js"></script>
  </body>
</html>
