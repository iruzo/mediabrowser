services:

  pro:
    build: .
    ports:
      - "30003:30003"
    volumes:
      - ./data:/data:z
    restart: unless-stopped
    environment:
      - BIND_ADDR=0.0.0.0
    profiles:
      - pro

  dev:
    image: docker.io/library/rust:1.94.1-alpine
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        apk add --no-cache musl-dev
        cargo install cargo-watch
        cargo watch -x run
    working_dir: /app
    # build:
    #   dockerfile: ./Dockerfile
    #   context: .
    #   # args:
    #   #   FEATURES: httpd
    volumes:
      - ./Cargo.toml:/app/Cargo.toml:z
      - ./Cargo.lock:/app/Cargo.lock:z
      - ./build.rs:/app/build.rs:z
      - ./src:/app/src:z
      - ./data:/data:z
    ports:
      - "30003:30003"
    environment:
      - BIND_ADDR=0.0.0.0
    profiles:
      - dev
