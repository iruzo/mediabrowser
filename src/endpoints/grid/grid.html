<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{TITLE}}</title>
    <style>{{CSS}}</style>
  </head>
  <body>
    <div class="grid">{{BOXES}}</div>
    <div class="toolbar">
      <button class="show-mkdir">mkdir</button>
      <button class="show-upload">upload</button>
      <form class="mkdir" method="post" action="/api/mkdir" hidden>
        <input name="path" placeholder="folder path" required />
        <button>create</button>
      </form>
      <form class="upload" method="post" action="/api/upload" enctype="multipart/form-data" hidden>
        <input type="hidden" name="path" value="{{PATH}}" />
        <input type="file" name="file" multiple />
      </form>
    </div>
    <script>{{SCRIPT}}</script>
  </body>
</html>
