<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>/</title>
    <style>
      {{CSS}}
    </style>
  </head>
  <body>
    <main id="directories"></main>
    <nav class="bar gallery-bar">
      <form class="search">
        <input name="query" placeholder="search" />
      </form>
      <button type="button" class="menu-toggle" popovertarget="menu">
        menu
      </button>
    </nav>

    <div id="selection-menu" hidden>
      <button type="button" id="selected-download">download</button>
      <input id="selected-cp-to" placeholder="destination path" hidden />
      <button type="button" id="selected-cp">cp</button>
      <input id="selected-mv-to" placeholder="destination path" hidden />
      <button type="button" id="selected-mv">mv</button>
      <button type="button" id="selected-rm">rm</button>
    </div>

    <div id="menu" class="popover" popover="manual">
      <input id="name" placeholder="dir name" autocomplete="off" />
      <button type="button" id="mkdir">mkdir</button>
      <button type="button" id="select">select</button>
      <div class="menu-row">
        <span>size</span><button type="button" id="cellminus">-</button
        ><button type="button" id="cellplus">+</button>
      </div>
      <div class="menu-row">
        <span>sort</span><a class="on" href="?sort=name">name</a
        ><a href="?sort=date">date</a><a href="?sort=size">size</a
        ><a href="?sort=type">type</a>
      </div>
      <div class="menu-row">
        <span>filter</span><a class="on" href="?filter=all">all</a
        ><a href="?filter=image">image</a><a href="?filter=video">video</a
        ><a href="?filter=audio">audio</a
        ><a href="?filter=text">text</a>
      </div>
    </div>

    <div id="action-menu" class="popover" popover="manual">
      <button type="button" class="upload-files" hidden>upload</button>
      <button type="button" class="download">download</button>
      <input class="to cp-to" placeholder="destination path" hidden />
      <button type="button" class="cp">cp</button>
      <input class="to mv-to" placeholder="destination path" hidden />
      <button type="button" class="mv">mv</button>
      <button type="button" class="rm">rm</button>
    </div>

    <form
      class="upload"
      method="post"
      action="/api/upload"
      enctype="multipart/form-data"
      hidden
    >
      <input type="hidden" name="path" />
      <input type="file" name="file" multiple />
    </form>
    <output id="progress" hidden></output>

    <template id="directory-template">
      <details class="directory">
        <summary>
          <span class="directory-name"></span>
          <button type="button" class="action-menu-toggle directory-menu-toggle">
            ...
          </button>
        </summary>
        <div class="grid"></div>
        <p class="empty" hidden>empty</p>
        <div class="sentinel" hidden>more</div>
      </details>
    </template>

    <template id="item-template">
      <div class="item">
        <a target="_top"><img alt="" /><span class="name"></span></a>
        <button type="button" class="action-menu-toggle item-menu-toggle">...</button>
      </div>
    </template>

    <main id="viewer-root" hidden>
      <div class="viewer">
        <img data-type="image" hidden />
        <video data-type="video" controls hidden></video>
        <audio data-type="audio" controls hidden></audio>
      </div>
      <nav class="bar viewer-bar">
        <a id="prev">prev</a>
        <a id="close">close</a>
        <a id="next">next</a>
        <button type="button" class="menu-toggle" popovertarget="viewer-menu">
          menu
        </button>
      </nav>
      <div id="viewer-menu" class="popover" popover="auto">
        <button type="button" id="viewer-download">download</button>
        <div class="menu-row" data-types="image video" hidden>
          <span>zoom</span><button type="button" data-zoom="in">+</button
          ><button type="button" data-zoom="out">-</button
          ><button type="button" data-zoom="reset">reset</button>
        </div>
        <div class="menu-row" data-types="image video" hidden>
          <span>move</span
          ><button type="button" data-move="0 25">up</button
          ><button type="button" data-move="0 -25">down</button
          ><button type="button" data-move="25 0">left</button
          ><button type="button" data-move="-25 0">right</button>
        </div>
        <div class="menu-row" data-types="image video" hidden>
          <span>rotate</span
          ><button type="button" data-rot="-45">left</button
          ><button type="button" data-rot="45">right</button>
        </div>
        <div class="menu-row" data-types="video" hidden>
          <span>loop</span><input id="loopstart" placeholder="0:00" /><span
            >-</span
          ><input id="loopend" placeholder="0:00" /><button
            type="button"
            id="loopclear"
          >
            clear
          </button>
        </div>
        <div class="menu-row" data-types="video" hidden>
          <span>seek</span><button type="button" data-seek="-1">-1s</button
          ><button type="button" data-seek="1">+1s</button>
        </div>
      </div>
    </main>

    <script>
      UI_SCRIPT;
    </script>
  </body>
</html>
